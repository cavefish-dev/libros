name: ejemplos_sql
services:
  mysql:
    image: mysql:8.0
    restart: always
    environment:
      MYSQL_ROOT_PASSWORD: rootpassword
      MYSQL_DATABASE: exampledb
      MYSQL_USER: exampleuser
      MYSQL_PASSWORD: examplepass
    ports:
      - "3306:3306"
    volumes:
      - ./init_db_mysql:/docker-entrypoint-initdb.d
      - ./mysql_home:/home
    healthcheck:
      test: ["CMD", "mysqladmin" ,"ping", "-h", "localhost"]
      timeout: 20s
      retries: 10

  postgres:
    image: postgres:15
    restart: always
    environment:
      POSTGRES_DB: exampledb
      POSTGRES_USER: exampleuser
      POSTGRES_PASSWORD: examplepass
    ports:
      - "5432:5432"
    volumes:
      - ./init_db_psql:/docker-entrypoint-initdb.d
      - ./psql_home:/home
    healthcheck:
      test: ["CMD-SHELL", "pg_isready", "-d", "db_prod"]
      timeout: 20s
      retries: 10

  phpmyadmin_x64:
    image: phpmyadmin/phpmyadmin:5.2.3
    platform: linux/amd64
    profiles:
      - x64
    restart: always
    environment:
      PMA_HOST: mysql
      PMA_USER: exampleuser
      PMA_PASSWORD: examplepass
    ports:
      - "8080:80"
    volumes:
      - ./mysql_home:/home
    depends_on:
      - mysql

  phpmyadmin_arm64:
    image: arm64v8/phpmyadmin:5.2.3
    platform: linux/arm64/v8
    profiles:
      - arm64
    restart: always
    environment:
      PMA_HOST: mysql
      PMA_USER: exampleuser
      PMA_PASSWORD: examplepass
    ports:
      - "8080:80"
    volumes:
      - ./mysql_home:/home
    depends_on:
      - mysql

  pgadmin:
    image: dpage/pgadmin4:9.10.0
    restart: always
    environment:
      PGADMIN_DEFAULT_EMAIL: admin@example.com
      PGADMIN_DEFAULT_PASSWORD: admin
      PGADMIN_CONFIG_SERVER_MODE: "False"
      PGADMIN_CONFIG_MASTER_PASSWORD_REQUIRED: "False"
    ports:
      - "8081:80"
    depends_on:
      - postgres
    volumes:
      - ./pgadmin_servers.json:/pgadmin4/servers.json
      - ./psql_home:/home
